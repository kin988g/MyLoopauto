name: Publish to Cloudflare Pages
run-name: Publish ${{ inputs.domain }} ${{ inputs.release_id }}
on:
  workflow_dispatch:
    inputs:
      domain:
        description: Apex domain or subdomain to publish
        required: true
        type: string
      expected_sha:
        description: Commit approved by Autoloop (optional for manual runs)
        required: false
        type: string
      release_id:
        description: Autoloop release identifier (optional for manual runs)
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      DEPLOY_DOMAIN: ${{ inputs.domain }}
      RELEASE_SHA: ${{ github.sha }}
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      CF_PAGES_PROJECT: ${{ vars.CF_PAGES_PROJECT }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Validate inputs and approved revision
        run: |
          node --input-type=module <<'JS'
          import { deploymentSettings } from './scripts/domain.mjs';
          const settings = deploymentSettings(process.env);
          if (process.env.EXPECTED_SHA && process.env.EXPECTED_SHA !== settings.sha) {
            throw new Error('main has changed since approval. Approve the current commit before publishing.');
          }
          JS
      - run: npm test
      - run: npm run build
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Publish and verify custom domain
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GODADDY_PAT: ${{ secrets.GODADDY_PAT }}
        run: npm run publish:pages
      - uses: actions/upload-artifact@v4
        with:
          name: verified-release
          path: publish-report.json
          if-no-files-found: error
